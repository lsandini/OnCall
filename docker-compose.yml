services:
  oncall-backend:
    image: lsandini/oncall-backend:latest
    ports:
      - "3001:3001"

  oncall-frontend:
    image: lsandini/oncall-frontend:latest
    ports:
      - "5173:80"
    volumes:
      - ./frontend/nginx.docker.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - oncall-backend